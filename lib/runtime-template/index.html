<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07060a;
        --surface: #16141a;
        --surface-2: #1c1a21;
        --surface-3: #24212a;
        --border: rgba(255, 255, 255, 0.06);
        --text: #f5f1ed;
        --muted: #9b968f;
        --accent: #ff6b1a;
        --cyan: #22d3ee;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
      }
      header h1 { font-size: 14px; font-weight: 600; margin: 0; }
      header .role { font-size: 11px; color: var(--muted); }
      #log {
        flex: 1; overflow-y: auto; padding: 20px;
        display: flex; flex-direction: column; gap: 12px;
        max-width: 820px; width: 100%; margin: 0 auto;
      }
      .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
      .msg.user { align-self: flex-end; background: var(--surface-2); border: 1px solid var(--border); max-width: 85%; }
      .msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); max-width: 90%; }
      .msg.empty { color: var(--muted); font-style: italic; }
      form {
        display: flex; gap: 8px; padding: 14px 20px;
        border-top: 1px solid var(--border); background: var(--surface);
        max-width: 820px; width: 100%; margin: 0 auto;
      }
      textarea {
        flex: 1; resize: none; background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
        font: inherit; min-height: 44px; max-height: 160px;
      }
      textarea:focus { outline: none; border-color: rgba(255, 107, 26, 0.5); }
      button {
        background: var(--accent); color: #0a0c10; border: none; border-radius: 8px;
        padding: 0 18px; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <h1 id="title">Agent</h1>
      <span class="role" id="role"></span>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Message the agent…" rows="1"></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const messages = [];

      fetch("/health")
        .then((r) => r.json())
        .then((d) => {
          if (d && d.agent) {
            document.getElementById("title").textContent = d.agent;
            document.title = d.agent;
          }
        })
        .catch(() => {});

      function addMsg(role, text) {
        const el = document.createElement("div");
        el.className = "msg " + role;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      async function send(text) {
        messages.push({ role: "user", content: text });
        addMsg("user", text);
        const el = addMsg("assistant", "");
        el.classList.add("empty");
        el.textContent = "…";
        sendBtn.disabled = true;
        let acc = "";
        try {
          const resp = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
          });
          const reader = resp.body.getReader();
          const decoder = new TextDecoder();
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            acc += decoder.decode(value, { stream: true });
            el.classList.remove("empty");
            el.textContent = acc;
            log.scrollTop = log.scrollHeight;
          }
        } catch (e) {
          el.textContent = "[connection error] " + e;
        }
        if (!acc) {
          el.textContent = "[no response]";
        } else {
          messages.push({ role: "assistant", content: acc });
        }
        sendBtn.disabled = false;
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || sendBtn.disabled) return;
        input.value = "";
        send(text);
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
